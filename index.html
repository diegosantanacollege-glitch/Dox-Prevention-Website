<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dox Prevention</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --white: #ffffff;
            --ink: #0b0b0b;
            --panel: rgba(0, 0, 0, 0.55);
            --radius: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #000;
            color: var(--white);
            font-family: "Inter", system-ui, sans-serif;
            line-height: 1.5;
        }

        /* ---------- Background video (blue tint, looping) ---------- */
        #bg-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            /* blue tint */
            filter: grayscale(1) sepia(1) hue-rotate(185deg) saturate(3.5) brightness(0.95);
        }
        /* light neutral shade (not blue) just to keep text readable */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: rgba(0, 0, 0, 0.18);
        }

        /* ---------- Layout ---------- */
        main {
            width: min(920px, 92%);
            margin: 0 auto;
            padding: 56px 0 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 28px;
        }

        header { text-align: center; }
        h1 {
            font-family: "Cinzel", serif;
            font-size: clamp(2.2rem, 6vw, 3.8rem);
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.6);
        }
        .tagline {
            margin-top: 10px;
            opacity: 0.9;
            letter-spacing: 1px;
            text-shadow: 0 1px 10px rgba(0, 0, 0, 0.7);
        }
        .divider {
            width: 90px;
            height: 3px;
            margin: 18px auto 0;
            border-radius: 3px;
            background: var(--gold);
        }

        /* ---------- Cards ---------- */
        .card, .info-section {
            width: 100%;
            background: var(--panel);
            border: 1px solid var(--gold);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }

        /* ---------- Drop zone: white rectangle ---------- */
        .dropzone {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            padding: 36px 20px;
            border: 2px solid var(--white);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            transition: background 0.3s, box-shadow 0.3s;
            text-align: center;
        }
        .dropzone.dragover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 22px rgba(255, 255, 255, 0.45);
        }
        .dropzone p { opacity: 0.9; font-size: 0.95rem; }

        .file-controls, .action-buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 14px;
            width: 100%;
        }

        #active-file {
            margin-top: 18px;
            text-align: center;
            font-size: 0.95rem;
            padding: 10px 16px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.08);
            display: inline-block;
        }
        #active-file span { color: var(--gold); font-weight: 600; word-break: break-all; }

        /* ---------- Buttons: dark + gold, soft glow ---------- */
        button {
            background: var(--ink);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px 24px;
            border-radius: 6px;
            font-family: "Cinzel", serif;
            font-weight: 700;
            letter-spacing: 1.5px;
            font-size: 0.95rem;
            cursor: pointer;
            min-width: 200px;
            transition: box-shadow 0.3s ease, background 0.3s ease, color 0.3s ease;
        }
        button:hover:not(:disabled),
        button:focus-visible:not(:disabled) {
            background: #1a1608;
            color: #f3d567;
            box-shadow: 0 0 14px rgba(212, 175, 55, 0.65), inset 0 0 8px rgba(212, 175, 55, 0.25);
            outline: none;
        }
        button:active:not(:disabled) {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.85), inset 0 0 12px rgba(212, 175, 55, 0.35);
        }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        button.secondary { background: transparent; }

        /* ---------- Removal controls ---------- */
        .removal-controls {
            display: none;
            flex-direction: column;
            gap: 20px;
        }
        .removal-controls.visible { display: flex; }
        .removal-controls h3 {
            font-family: "Cinzel", serif;
            color: var(--gold);
            letter-spacing: 1px;
        }
        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
        }
        .checkbox-item {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            border: 1px solid var(--gold);
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
            transition: box-shadow 0.25s;
            user-select: none;
        }
        .checkbox-item:hover { box-shadow: 0 0 10px rgba(212, 175, 55, 0.5); }
        .checkbox-item input { accent-color: var(--gold); width: 16px; height: 16px; }

        /* ---------- Info tables ---------- */
        #sections-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .info-section h2 {
            font-family: "Cinzel", serif;
            font-size: 1.2rem;
            color: var(--gold);
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--gold);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td {
            padding: 9px 10px;
            text-align: left;
            vertical-align: top;
            font-size: 0.92rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        th { width: 35%; font-weight: 600; }
        td { word-break: break-word; }
        tr:last-child th, tr:last-child td { border-bottom: none; }

        /* ---------- Popup (your art) ---------- */
        .popup {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        .popup-content {
            position: relative;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            max-width: 92vw;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
        }
        .popup-content img { width: 400px; max-width: 100%; border-radius: 4px; display: block; }
        #close {
            position: absolute;
            top: -14px;
            right: -14px;
            width: 34px;
            height: 34px;
            line-height: 32px;
            text-align: center;
            font-size: 22px;
            color: var(--ink);
            background: var(--gold);
            border-radius: 50%;
            cursor: pointer;
        }

        footer { opacity: 0.7; font-size: 0.8rem; text-align: center; text-shadow: 0 1px 8px #000; }

        @media (max-width: 600px) {
            button { width: 100%; }
            th { width: 40%; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>

    <!-- Background video: blue tinted, continuous loop -->
    <video id="bg-video" autoplay muted loop playsinline preload="auto">
        <source src="0000.mp4" type="video/mp4">
    </video>
    <div class="bg-overlay"></div>

    <!-- Popup -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="close" role="button" aria-label="Close">&times;</span>
            <img id="popup-image" src="frontend/nakedtorso0037.png" alt="Image">
        </div>
    </div>

    <main>
        <header>
            <h1>Dox Prevention</h1>
            <p class="tagline">Strip hidden personal data from your files before you share them.</p>
            <div class="divider"></div>
        </header>

        <section class="card">
            <div class="dropzone" id="dropzone">
                <input type="file" id="file-input" hidden>
                <p>Drag &amp; drop a file here, or choose one below</p>
                <div class="file-controls">
                    <button type="button" id="upload-btn">Upload File</button>
                    <button type="button" id="remove-file-btn" class="secondary">Remove File</button>
                </div>
            </div>
            <div style="text-align:center">
                <div id="active-file">Active File: <span>None</span></div>
            </div>
        </section>

        <section class="card removal-controls" id="removal-controls">
            <h3>Choose what to remove</h3>
            <div class="checkbox-container" id="checkbox-container"></div>
            <div class="action-buttons">
                <button type="button" id="remove-selected-btn">Remove Selected</button>
                <button type="button" id="remove-all-btn">Remove All</button>
            </div>
        </section>

        <div id="sections-container"></div>

        <footer>Files are processed by your local server at localhost:9000.</footer>
    </main>

    <script>
        /* ---------------- POPUP IMAGE CYCLE ---------------- */
        const popup = document.getElementById('popup');
        const popupImage = document.getElementById('popup-image');
        const closeBtn = document.getElementById('close');

        const images = [
            'frontend/nakedtorso0037.png',
            'frontend/nakedtorso0074.png'
        ];
        let current = 0;
        let cycleTimer = null;

        if (!sessionStorage.getItem('popupShown')) {
            popup.style.display = 'flex';
            sessionStorage.setItem('popupShown', 'true');
            cycleTimer = setInterval(() => {
                current = (current + 1) % images.length;
                popupImage.src = images[current];
            }, 2000);
        }

        function closePopup() {
            popup.style.display = 'none';
            if (cycleTimer) clearInterval(cycleTimer);
        }
        closeBtn.onclick = closePopup;
        popup.addEventListener('click', e => { if (e.target === popup) closePopup(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

        /* ---------------- BACKGROUND VIDEO LOOP ---------------- */
        const bgVideo = document.getElementById('bg-video');
        bgVideo.play().catch(() => {
            document.addEventListener('click', () => bgVideo.play(), { once: true });
        });
        // Fallback: restart if the loop attribute is ever ignored
        bgVideo.addEventListener('ended', () => {
            bgVideo.currentTime = 0;
            bgVideo.play();
        });

        /* ---------------- MAIN FUNCTIONALITY ---------------- */
        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const removeFileBtn = document.getElementById('remove-file-btn');
        const removeSelectedBtn = document.getElementById('remove-selected-btn');
        const removeAllBtn = document.getElementById('remove-all-btn');
        const activeFileLabel = document.getElementById('active-file');
        const checkboxContainer = document.getElementById('checkbox-container');
        const sectionsContainer = document.getElementById('sections-container');
        const removalControls = document.getElementById('removal-controls');
        const dropzone = document.getElementById('dropzone');

        function setActiveFile(name) {
            activeFileLabel.textContent = 'Active File: ';
            const span = document.createElement('span');
            span.textContent = name;
            activeFileLabel.appendChild(span);
        }

        function clearAll() {
            checkboxContainer.innerHTML = '';
            sectionsContainer.innerHTML = '';
            removalControls.classList.remove('visible');
        }

        function renderSections(sectionsData) {
            clearAll();
            let hasCheckboxes = false;

            for (const [sectionName, kvPairs] of Object.entries(sectionsData)) {
                if (sectionName !== 'File Information') {
                    const label = document.createElement('label');
                    label.className = 'checkbox checkbox-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'remove-section';
                    checkbox.value = sectionName;
                    checkbox.checked = true;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(sectionName));
                    checkboxContainer.appendChild(label);
                    hasCheckboxes = true;
                }

                const sectionEl = document.createElement('section');
                sectionEl.className = 'info-section';
                sectionEl.id = sectionName.toLowerCase().replace(/\s+/g, '-');

                const h2 = document.createElement('h2');
                h2.textContent = sectionName;
                sectionEl.appendChild(h2);

                const table = document.createElement('table');
                const tbody = document.createElement('tbody');

                for (const [key, val] of Object.entries(kvPairs)) {
                    const tr = document.createElement('tr');
                    const th = document.createElement('th');
                    th.textContent = key;
                    const td = document.createElement('td');
                    td.textContent = val !== undefined && val !== null ? val : '';
                    td.setAttribute('data-field', key);
                    tr.appendChild(th);
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                }

                table.appendChild(tbody);
                sectionEl.appendChild(table);
                sectionsContainer.appendChild(sectionEl);
            }

            if (hasCheckboxes) removalControls.classList.add('visible');
        }

        async function handleFile(file) {
            if (!file) return;
            setActiveFile(file.name);
            uploadBtn.textContent = 'Parsing...';
            uploadBtn.disabled = true;

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('http://localhost:9000/parse-file', {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error(`Server returned status ${response.status}`);
                const data = await response.json();
                if (data.sections) renderSections(data.sections);
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                uploadBtn.textContent = 'Upload File';
                uploadBtn.disabled = false;
            }
        }

        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            if (fileInput.files.length) handleFile(fileInput.files[0]);
        });

        /* Drag & drop */
        ['dragenter', 'dragover'].forEach(evt =>
            dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
        ['dragleave', 'drop'].forEach(evt =>
            dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
        dropzone.addEventListener('drop', e => {
            if (e.dataTransfer.files.length) {
                fileInput.files = e.dataTransfer.files;
                handleFile(e.dataTransfer.files[0]);
            }
        });

        removeFileBtn.addEventListener('click', () => {
            fileInput.value = '';
            setActiveFile('None');
            clearAll();
        });

        async function submitModification(sectionsValue, buttonElement, originalText) {
            if (fileInput.files.length === 0) {
                alert('Please select a file first.');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            buttonElement.textContent = 'Processing...';
            buttonElement.disabled = true;

            try {
                const response = await fetch(`http://localhost:9000/modify_file/${encodeURIComponent(sectionsValue)}`, {
                    method: 'POST',
                    body: formData
                });
                if (!response.ok) throw new Error(`Server returned status ${response.status}`);

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);
            } catch (error) {
                alert(`Error: ${error.message}`);
            } finally {
                buttonElement.textContent = originalText;
                buttonElement.disabled = false;
            }
        }

        removeSelectedBtn.addEventListener('click', () => {
            const checked = document.querySelectorAll('input[name="remove-section"]:checked');
            if (checked.length === 0) {
                alert('Please select at least one section to remove.');
                return;
            }
            const sections = Array.from(checked).map(cb => cb.value).join(',');
            submitModification(sections, removeSelectedBtn, 'Remove Selected');
        });

        removeAllBtn.addEventListener('click', () => {
            submitModification('all', removeAllBtn, 'Remove All');
        });
    </script>

</body>
</html>
