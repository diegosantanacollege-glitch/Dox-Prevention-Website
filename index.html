<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dox Prevention</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Small layout safety tweaks to prevent button & checkbox overflow */
        .removal-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }
        .checkbox-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            width: 100%;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            width: 100%;
            margin-top: 5px;
        }

        /* Background video */
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.25; /* low opacity */
            z-index: -1;
        }

        /* Popup styling */
        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .popup-content {
            position: relative;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .popup-content img {
            width: 400px;
            border-radius: 8px;
        }

        #close {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Background video -->
    <video autoplay muted loop id="bg-video">
        <source src="frontend/videoforwebsite.mp4" type="video/mp4">
    </video>

    <!-- Popup container -->
    <div id="popup" class="popup">
        <div class="popup-content">
            <span id="close">&times;</span>
            <img id="popup-image" src="frontend/nakedtorso0037.png" alt="Image">
        </div>
    </div>

    <main>
        <h1>Dox Prevention</h1>

        <div class="file-controls">
            <input type="file" id="file-input" hidden>
            <button type="button" id="upload-btn">Upload File</button>
            <button type="button" id="remove-file-btn">Remove File</button>
        </div>

        <div class="info-section" id="active-file">
            <label>Active File: None</label>
        </div>

        <!-- Removal options container with separate lines for checkboxes and buttons -->
        <div class="removal-controls" id="removal-controls">
            <div class="checkbox-container" id="checkbox-container">
                <!-- Dynamic checkboxes inserted here -->
            </div>
            <div class="action-buttons">
                <button type="button" id="remove-selected-btn">Remove Selected Confidential Information</button>
                <button type="button" id="remove-all-btn">Remove All Confidential Information</button>
            </div>
        </div>

        <!-- Dynamic sections container -->
        <div id="sections-container"></div>

    </main>

    <script>
        /* ---------------- POPUP IMAGE CYCLE ---------------- */

        const popup = document.getElementById('popup');
        const popupImage = document.getElementById('popup-image');
        const closeBtn = document.getElementById('close');

        const images = [
            'frontend/nakedtorso0037.png',
            'frontend/nakedtorso0074.png'
        ];

        let current = 0;

        // Show popup only once per session
        if (!sessionStorage.getItem('popupShown')) {
            popup.style.display = 'flex';
            sessionStorage.setItem('popupShown', 'true');
            cycleImages();
        }

        function cycleImages() {
            setInterval(() => {
                current = (current + 1) % images.length;
                popupImage.src = images[current];
            }, 2000); // change every 2 seconds
        }

        closeBtn.onclick = () => {
            popup.style.display = 'none';
        };

        /* ---------------- ORIGINAL FUNCTIONALITY ---------------- */

        const fileInput = document.getElementById('file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const removeFileBtn = document.getElementById('remove-file-btn');
        const removeSelectedBtn = document.getElementById('remove-selected-btn');
        const removeAllBtn = document.getElementById('remove-all-btn');
        const activeFileLabel = document.getElementById('active-file');
        const checkboxContainer = document.getElementById('checkbox-container');
        const sectionsContainer = document.getElementById('sections-container');

        function renderSections(sectionsData) {
            checkboxContainer.innerHTML = '';
            sectionsContainer.innerHTML = '';

            for (const [sectionName, kvPairs] of Object.entries(sectionsData)) {
                if (sectionName !== "File Information") {
                    const label = document.createElement('label');
                    label.className = 'checkbox checkbox-item';

                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.name = 'remove-section';
                    checkbox.value = sectionName;
                    checkbox.checked = true;

                    label.appendChild(checkbox);
                    label.appendChild(document.createTextNode(' ' + sectionName));
                    checkboxContainer.appendChild(label);
                }

                const sectionEl = document.createElement('section');
                sectionEl.className = 'info-section';
                sectionEl.id = sectionName.toLowerCase().replace(/\s+/g, '-');

                const h2 = document.createElement('h2');
                h2.textContent = sectionName;
                sectionEl.appendChild(h2);

                const table = document.createElement('table');
                const tbody = document.createElement('tbody');

                for (const [key, val] of Object.entries(kvPairs)) {
                    const tr = document.createElement('tr');

                    const th = document.createElement('th');
                    th.textContent = key;

                    const td = document.createElement('td');
                    td.textContent = val !== undefined && val !== null ? val : '';
                    td.setAttribute('data-field', key);

                    tr.appendChild(th);
                    tr.appendChild(td);
                    tbody.appendChild(tr);
                }

                table.appendChild(tbody);
                sectionEl.appendChild(table);
                sectionsContainer.appendChild(sectionEl);
            }
        }

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async () => {
            if (fileInput.files.length === 0) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);
            activeFileLabel.innerHTML = `<label>Active File: ${file.name}</label>`;

            uploadBtn.textContent = 'Parsing...';

            try {
                const response = await fetch('http://localhost:9000/parse-file', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const data = await response.json();

                if (data.sections) {
                    renderSections(data.sections);
                }

                uploadBtn.textContent = 'Upload File';
            } catch (error) {
                alert(`Error: ${error.message}`);
                uploadBtn.textContent = 'Upload File';
            }
        });

        removeFileBtn.addEventListener('click', () => {
            fileInput.value = '';
            activeFileLabel.innerHTML = '<label>Active File: None</label>';
            checkboxContainer.innerHTML = '';
            sectionsContainer.innerHTML = '';
        });

        async function submitModification(sectionsValue, buttonElement, originalText) {
            if (fileInput.files.length === 0) {
                alert('Please select a file first.');
                return;
            }

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('file', file);

            buttonElement.textContent = 'Processing...';

            try {
                const response = await fetch(`http://localhost:9000/modify_file/${encodeURIComponent(sectionsValue)}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server returned status ${response.status}`);
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = file.name;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                buttonElement.textContent = originalText;
            } catch (error) {
                alert(`Error: ${error.message}`);
                buttonElement.textContent = originalText;
            }
        }

        removeSelectedBtn.addEventListener('click', async () => {
            const checkboxes = document.querySelectorAll('input[name="remove-section"]:checked');
            if (checkboxes.length === 0) {
                alert('Please select at least one section to remove.');
                return;
            }

            const sections = Array.from(checkboxes).map(cb => cb.value).join(',');
            await submitModification(sections, removeSelectedBtn, 'Remove Selected Confidential Information');
        });

        removeAllBtn.addEventListener('click', async () => {
            await submitModification('all', removeAllBtn, 'Remove All Confidential Information');
        });
    </script>

</body>
</html>
